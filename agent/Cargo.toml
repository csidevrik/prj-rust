[package]
name = "agent"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = { version = "0.9", features = ["transport"] }
prost = "0.11"
tokio = { version = "1.0", features = ["full", "macros"] }
sysinfo = "0.29"
local-ip-address = "0.5"
network-interface = "1.0"
async-trait = "0.1"
ratatui = "0.24"
crossterm = "0.27"
tokio-util = "0.7"

[build-dependencies]
tonic-build = { version = "0.9", features = ["prost"] } 